# Keeps the pinned GitHub Actions current (pull requests with the new commit SHA and version comment).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: [dependencies]
