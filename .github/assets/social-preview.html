  Social preview / README banner. Source of social-preview-1280x640.* and social-preview-1820x640.*
  Render: open in a Chromium-based browser and capture the viewport at exactly 1280x640 or 1820x640
  (device scale factor 1). Viewports of 1500 px and wider switch to the banner layout automatically.
  Fonts: Inter / Inter Display and DejaVu Sans Mono (installed locally).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg1: #0a1a33; --bg2: #10305a; --ink: #f4f7fb; --muted: #a9bad3; --line: #2b4a75;
    --sky: #4cc3ff; --green: #3ddc97; --amber: #ffc861;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background:
      radial-gradient(1200px 700px at 85% 20%, rgba(76,195,255,0.16), transparent 60%),
      radial-gradient(900px 600px at 0% 100%, rgba(61,220,151,0.10), transparent 60%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--ink); font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--pad, 76px);
    position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 55%, #000 100%);
  }
  .left { width: var(--leftw, 650px); position: relative; z-index: 1; }
  .repo {
    font-family: 'DejaVu Sans Mono', monospace; font-size: 25px; color: var(--sky);
    letter-spacing: 0.2px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px;
  }
  .repo .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--sky); box-shadow: 0 0 14px var(--sky); }
  h1 {
    font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 800;
    font-size: 62px; line-height: 1.05; letter-spacing: -1.6px; margin-bottom: 24px;
  }
  h1 em { font-style: normal; color: var(--green); display: var(--emd, inline); }
  .sub { font-size: 25px; line-height: 1.42; color: var(--muted); margin-bottom: 36px; max-width: var(--subw, 620px); }
  .sub b { color: var(--ink); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-size: 19px; font-weight: 600; color: var(--ink);
    padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line);
    background: rgba(255,255,255,0.04);
  }
  .chip.k { border-color: rgba(76,195,255,0.55); color: #d9f2ff; }
  .right { position: relative; z-index: 1; width: 460px; height: 520px; flex-shrink: 0; }
  svg text { font-family: 'Inter', sans-serif; }
  @media (min-width: 1500px) { :root { --pad: 130px; --leftw: 1000px; --emd: block; --subw: 820px; } }
</style>
</head>
<body>
  <div class="left">
    <div class="repo"><span class="dot"></span>cloudsync-soa-toolkit</div>
    <h1>Passwordless cloud users in Active&nbsp;Directory, <em>always able to sign in</em></h1>
    <p class="sub">For <b>Entra Cloud Sync</b> (Entra ID → AD): SCRIL, automatic secret rolling by the DCs and <b>AD object enforcement</b>, fully automated.</p>
    <div class="chips">
      <span class="chip k">Cloud Kerberos Trust</span>
      <span class="chip">PowerShell 5.1 / 7</span>
      <span class="chip">MPL-2.0</span>
    </div>
  </div>

  <div class="right">
    <svg width="460" height="520" viewBox="0 0 460 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#16396a"/><stop offset="1" stop-color="#112c52"/>
        </linearGradient>
        <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#4cc3ff"/>
        </marker>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- connectors -->
      <line x1="96" y1="128" x2="96" y2="196" stroke="#4cc3ff" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arr)"/>
      <text x="116" y="168" font-size="17" fill="#a9bad3" font-weight="600">Cloud Sync provisions</text>
      <line x1="96" y1="320" x2="96" y2="388" stroke="#3ddc97" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arr)"/>
      <text x="116" y="360" font-size="17" fill="#a9bad3" font-weight="600">secret expired? DC rolls it</text>

      <!-- node 1: Entra ID (cloud) -->
      <rect x="16" y="20" width="440" height="104" rx="18" fill="url(#card)" stroke="#2b4a75" stroke-width="1.5"/>
      <g transform="translate(46,46)">
        <path d="M14 44 h36 a13 13 0 0 0 0-26 a18 18 0 0 0-34-5 a12 12 0 0 0-2 31 z" fill="none" stroke="#4cc3ff" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <text x="124" y="66" font-size="26" font-weight="700" fill="#f4f7fb">Entra ID</text>
      <text x="124" y="96" font-size="18" fill="#a9bad3">cloud-only &amp; SOA users</text>

      <!-- node 2: Active Directory (shield + rolling) -->
      <rect x="16" y="208" width="440" height="112" rx="18" fill="url(#card)" stroke="#4cc3ff" stroke-width="2"/>
      <g transform="translate(44,232)">
        <path d="M32 2 L58 12 V32 C58 50 46 60 32 66 C18 60 6 50 6 32 V12 Z" fill="rgba(76,195,255,0.12)" stroke="#4cc3ff" stroke-width="4" stroke-linejoin="round"/>
        <path d="M21 34 l8 8 l15 -16" fill="none" stroke="#f4f7fb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="124" y="254" font-size="26" font-weight="700" fill="#f4f7fb">Active Directory</text>
      <text x="124" y="282" font-size="18" fill="#a9bad3">SCRIL · PSO · enforcement on</text>
      <text x="124" y="306" font-size="18" fill="#a9bad3">event-driven on every DC</text>

      <!-- node 3: sign-in -->
      <rect x="16" y="400" width="440" height="104" rx="18" fill="rgba(61,220,151,0.10)" stroke="#3ddc97" stroke-width="2"/>
      <g transform="translate(44,422)" filter="url(#glow)">
        <circle cx="30" cy="30" r="27" fill="none" stroke="#3ddc97" stroke-width="4"/>
        <path d="M18 31 l8 8 l16 -17" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="124" y="446" font-size="26" font-weight="700" fill="#f4f7fb">Sign-in succeeds</text>
      <text x="124" y="476" font-size="18" fill="#a9bad3">WHfB · FIDO2 · AVD SSO</text>
    </svg>
  </div>
</body>
</html>
