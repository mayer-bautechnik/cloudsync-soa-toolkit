#
# Checks that need no domain: parser, PSScriptAnalyzer, unit + end-to-end tests (mocked AD), security claims,
# script scope, repository hygiene. Runs on PowerShell 7 (Linux) and Windows PowerShell 5.1 (Windows).
# Actions are pinned to full commit SHAs (version in the comment); Dependabot (.github/dependabot.yml) proposes updates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwsh7:
    name: PowerShell 7 - all static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15          # normal run: about 1-2 min; a hang (e.g. a prompt) fails fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 (Node.js 24)
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: Static checks
        shell: pwsh
        # -NonInteractive: any prompt (confirmation, missing parameter) fails instead of waiting forever
        run: pwsh -NoProfile -NonInteractive -File ./tools/Invoke-SoaStaticChecks.ps1 -RequireAnalyzer

  winps51:
    name: Windows PowerShell 5.1 - tests and claims
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.0 (Node.js 24)
      - name: Unit and end-to-end tests
        shell: powershell
        timeout-minutes: 10
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\Invoke-SoaUnitTests.ps1; exit $LASTEXITCODE
      - name: Security claims
        shell: powershell
        timeout-minutes: 5
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tools\Test-SoaSecurityClaims.ps1; exit $LASTEXITCODE
