name: Question or idea
description: A question about the toolkit, or a suggestion for an improvement.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        For a malfunction use the *Bug report* form; for security-relevant findings the private vulnerability report.
  - type: textarea
    id: text
    attributes:
      label: Question or idea
      description: Use placeholders (contoso.com) instead of real names.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The text contains no real domain, host, user or company names.
          required: true
