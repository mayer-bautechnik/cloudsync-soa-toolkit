name: Lab validation result
description: Results of the lab validation checklist L1-L20 (docs/VALIDATION.md).
labels: [validation]
body:
  - type: markdown
    attributes:
      value: |
        Run the checklist, record manual items with `.\Export-SoaReport.ps1 -Record Lx -Result PASS|FAIL -Note '...'`, then `.\Export-SoaReport.ps1`, review the folder and package it with `-Package`.
  - type: input
    id: version
    attributes:
      label: Toolkit version
      placeholder: "e.g. 2.0.5"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary (table L1-L20 from report.md)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Observations and deviations
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed the attachment; it contains no real domain, host, user or company names, and not the pseudonym map.
          required: true
