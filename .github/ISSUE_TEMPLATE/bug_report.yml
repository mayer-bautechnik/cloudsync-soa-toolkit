name: Bug report
description: Something in the toolkit does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security-relevant?** Do not open a public issue - use the private vulnerability report (Security tab).
        Create the attachment with `.\Export-SoaReport.ps1 -Purpose BugReport -Description '...'`, review the folder (README-FIRST.md) and package it with `-Package`. Do not attach raw reports of the other scripts or event logs, and never the pseudonym map. See docs/REPORTING.md.
  - type: input
    id: version
    attributes:
      label: Toolkit version
      placeholder: "e.g. 2.0.6"
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Script and step / suite / trigger
      placeholder: "Install-SoaToolkit.ps1 -Step AuditConfig"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you did, what you expected, what happened
      description: Use placeholders (contoso.com) instead of real names.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Anonymized report
      description: Attach the zip created with Export-SoaReport.ps1 -Package, or paste the relevant part of report.md.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed the attachment; it contains no real domain, host, user or company names, and not the pseudonym map.
          required: true
